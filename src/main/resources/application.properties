# Nombre de la aplicación Spring
spring.application.name=EcoMovil API

# --- INICIO DE LA CORRECCIÓN ---
# Render nos da la variable ${SPRING_DATASOURCE_URL} como "postgresql://..."
# Java necesita "jdbc:postgresql://...".
# ¡Así que le añadimos el prefijo "jdbc:" nosotros mismos!
spring.datasource.url=jdbc:${SPRING_DATASOURCE_URL}

# Ya no necesitamos ${SPRING_DATASOURCE_USERNAME} ni ${SPRING_DATASOURCE_PASSWORD}
# porque ya vienen incluidos dentro de la URL de Render.

# Estas variables las sigue pasando el render.yaml
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT}
# --- FIN DE LA CORRECCIÓN ---

server.port=8082
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO} # Movido aquí
spring.jpa.hibernate.naming.physical-strategy=upc.edu.ecomovil.api.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Información de la aplicación para la documentación
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# Propiedades de configuración de JWT
authorization.jwt.secret=WriteHereYourSecretStringForTokenSigningCredentials
authorization.jwt.expiration.days=7